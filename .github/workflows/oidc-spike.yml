# Temporary: GitHub Actions OIDC token -> Keycloak federated client -> kube-dc.
name: oidc-spike
on:
  workflow_dispatch:
    inputs:
      realm: { required: true }
      client: { required: true }
permissions:
  id-token: write
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Exchange
        env:
          REALM: ${{ inputs.realm }}
          CLIENT: ${{ inputs.client }}
          KUBE_DC_CA_CERT: ${{ secrets.KUBE_DC_CA_CERT }}
        run: |
          ISS="https://login.stage.kube-dc.com/realms/$REALM"
          gh_token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ISS" | jq -r .value)
          echo "$gh_token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub,aud,iss,repository,ref,environment}' || true
          resp=$(curl -sS "$ISS/protocol/openid-connect/token" -d grant_type=client_credentials --data-urlencode "client_id=$CLIENT" \
            -d client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer --data-urlencode "client_assertion=$gh_token")
          echo "$resp" | jq -c '{error,error_description,expires_in,token_type}'
          tok=$(echo "$resp" | jq -r .access_token)
          [ "$tok" != null ] || exit 1
          printf '%s\n' "$KUBE_DC_CA_CERT" > ca.pem
          kubectl --server=https://kube-api.stage.kube-dc.com:6443 --certificate-authority=ca.pem --token="$tok" auth whoami
          kubectl --server=https://kube-api.stage.kube-dc.com:6443 --certificate-authority=ca.pem --token="$tok" -n "$REALM-app" auth can-i create deployments.apps
